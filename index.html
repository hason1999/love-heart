<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shin ❤️</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}
canvas{display:block}
#msg{
position:absolute;left:50%;top:50%;
transform:translate(-50%,-50%);
font:700 64px Arial,sans-serif;
color:#fff;opacity:0;
text-shadow:0 0 10px #953131,0 0 25px #ff3ea5,0 0 40px #ff3ea5;
transition:opacity 2s;
pointer-events:none;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg">Anh yêu embe ❤️</div>
<script>
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}
addEventListener("resize",resize);resize();

const cx=()=>canvas.width/2, cy=()=>canvas.height/2;
const pts=[];
const scale=Math.min(canvas.width,canvas.height)/42;

for(let t=0;t<Math.PI*2;t+=0.008){
 let x=16*Math.pow(Math.sin(t),3);
 let y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
 pts.push({x:x*scale,y:-y*scale});
}

const N=4000;
const particles=[];
for(let i=0;i<N;i++){
 const p=pts[i%pts.length];
 const a=Math.random()*Math.PI*2;
 const r=Math.max(canvas.width,canvas.height)*(0.8+Math.random()*0.8);
 particles.push({
  sx:cx()+Math.cos(a)*r,
  sy:cy()+Math.sin(a)*r,
  tx:p.x,ty:p.y,
  ang:Math.random()*8,
  hue:(i/N)*360,
  prog:0,
  delay:Math.random()*2
 });
}
let start=null, fireworks=[];
function firework(){
 for(let k=0;k<250;k++){
   fireworks.push({
    x:cx(),y:cy(),
    a:Math.random()*Math.PI*2,
    v:2+Math.random()*5,
    life:80+Math.random()*40,
    hue:Math.random()*360
   });
 }
}
function draw(ts){
 if(!start)start=ts;
 const t=(ts-start)/1000;
 ctx.fillStyle="rgba(0,0,0,.15)";
 ctx.fillRect(0,0,canvas.width,canvas.height);

 let done=0;
 particles.forEach(p=>{
   let pr=Math.max(0,Math.min(1,(t-p.delay)/5));
   p.prog=pr;
   if(pr>=1)done++;
   const spiral=(1-pr)*220;
   const ang=p.ang+pr*12;
   const x=(1-pr)*p.sx+pr*(cx()+p.tx)+Math.cos(ang)*spiral;
   const y=(1-pr)*p.sy+pr*(cy()+p.ty)+Math.sin(ang)*spiral;
   ctx.beginPath();
   ctx.fillStyle=`hsl(${(p.hue+t*80)%360} 100% 60%)`;
   ctx.shadowBlur=12;
   ctx.shadowColor=ctx.fillStyle;
   ctx.arc(x,y,1.6,0,Math.PI*2);
   ctx.fill();
 });
 if(done===N){
   document.getElementById("msg").style.opacity=1;
   if(fireworks.length===0) firework();
 }
 fireworks.forEach((f,i)=>{
   f.x+=Math.cos(f.a)*f.v;
   f.y+=Math.sin(f.a)*f.v;
   f.v*=0.985;
   f.life--;
   ctx.beginPath();
   ctx.fillStyle=`hsla(${f.hue},100%,60%,${Math.max(f.life,0)/120})`;
   ctx.shadowBlur=8;
   ctx.shadowColor=ctx.fillStyle;
   ctx.arc(f.x,f.y,2,0,Math.PI*2);
   ctx.fill();
 });
 fireworks=fireworks.filter(f=>f.life>0);
 requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
