<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1,
           maximum-scale=1,
           user-scalable=no,
           viewport-fit=cover"
>

<title>Anh yêu embe ❤️</title>

<style>

/* =====================================================
   CƠ BẢN
===================================================== */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {

  width: 100%;
  height: 100%;

  margin: 0;
  padding: 0;

  overflow: hidden;

  background: #000;

  min-height: 100dvh;

  touch-action: manipulation;
}

body {
  position: relative;
}


/* =====================================================
   ẢNH NỀN KẾT THÚC
===================================================== */

#background {

  position: fixed;

  inset: 0;

  width: 100%;
  height: 100%;

  background-image:
    url("background.jpg");

  background-size: cover;

  background-position: center center;

  background-repeat: no-repeat;

  opacity: 0;

  transition:
    opacity 4s ease;

  z-index: 0;

}


/* Lớp tối phủ lên ảnh */

#background::after {

  content: "";

  position: absolute;

  inset: 0;

  background:
    linear-gradient(
      rgba(0,0,0,0.25),
      rgba(0,0,0,0.45)
    );

}


/* Khi kết thúc */

#background.show {

  opacity: 1;

}


/* =====================================================
   CANVAS
===================================================== */

#c {

  position: fixed;

  inset: 0;

  width: 100%;
  height: 100%;

  display: block;

  background: transparent;

  z-index: 1;

  transition:
    opacity 4s ease;

}


/* =====================================================
   CHỮ
===================================================== */

#msg {

  position: fixed;

  left: 50%;
  top: 50%;

  width: 90%;

  transform:
    translate(-50%, -50%);

  text-align: center;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  font-size:
    clamp(32px, 9vw, 64px);

  line-height: 1.2;

  font-weight: 700;

  color: #fff;

  opacity: 0;

  text-shadow:

    0 0 8px #ff6b9d,

    0 0 18px #ff3ea5,

    0 0 35px #ff3ea5,

    0 0 60px #ff1493;

  transition:
    opacity 2.5s ease;

  pointer-events: none;

  z-index: 2;

}


/* =====================================================
   ĐIỆN THOẠI NHỎ
===================================================== */

@media (max-width: 380px) {

  #msg {

    font-size: 30px;

  }

}


/* =====================================================
   ĐIỆN THOẠI NGANG
===================================================== */

@media (orientation: landscape) {

  #msg {

    font-size:
      clamp(28px, 7vw, 52px);

  }

}

</style>

</head>


<body>


<!-- ================================================
     BACKGROUND
================================================ -->

<div id="background"></div>


<!-- ================================================
     CANVAS
================================================ -->

<canvas id="c"></canvas>


<!-- ================================================
     LỜI NHẮN
================================================ -->

<div id="msg">

  Anh yêu embe ❤️

</div>


<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
  document.getElementById("c");

const ctx =
  canvas.getContext(
    "2d",
    {
      alpha: true
    }
  );


let width = 0;

let height = 0;

let dpr = 1;


/* =====================================================
   KIỂM TRA MOBILE
===================================================== */

const isMobile =
  /Android|iPhone|iPad|iPod/i.test(
    navigator.userAgent
  );


/* =====================================================
   RESIZE
===================================================== */

function resize() {

  width =
    window.innerWidth;

  height =
    window.innerHeight;


  dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );


  canvas.width =
    Math.floor(
      width * dpr
    );


  canvas.height =
    Math.floor(
      height * dpr
    );


  canvas.style.width =
    width + "px";


  canvas.style.height =
    height + "px";


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );


  createHeart();

}


window.addEventListener(
  "resize",
  resize,
  {
    passive: true
  }
);


window.addEventListener(
  "orientationchange",
  () => {

    setTimeout(
      resize,
      300
    );

  },
  {
    passive: true
  }
);


/* =====================================================
   CENTER
===================================================== */

function cx() {

  return width / 2;

}


function cy() {

  return height / 2;

}


/* =====================================================
   HEART
===================================================== */

let pts = [];


function createHeart() {

  pts = [];


  const minSize =
    Math.min(
      width,
      height
    );


  /*
    Kích thước trái tim
    tự động theo điện thoại
  */

  const scale =
    minSize / 42;


  for (
    let t = 0;
    t < Math.PI * 2;
    t += 0.008
  ) {


    const x =
      16 *
      Math.pow(
        Math.sin(t),
        3
      );


    const y =
      13 * Math.cos(t)

      - 5 *
        Math.cos(2 * t)

      - 2 *
        Math.cos(3 * t)

      - Math.cos(4 * t);


    pts.push({

      x:
        x * scale,

      y:
        -y * scale

    });

  }

}


/* =====================================================
   PARTICLES
===================================================== */

const N =
  isMobile
    ? 2800
    : 4000;


const particles = [];


function createParticles() {

  particles.length = 0;


  for (
    let i = 0;
    i < N;
    i++
  ) {


    const p =
      pts[
        Math.floor(
          Math.random() *
          pts.length
        )
      ];


    const angle =
      Math.random() *
      Math.PI *
      2;


    const distance =
      Math.max(
        width,
        height
      ) *
      (
        0.7 +
        Math.random() * 0.9
      );


    particles.push({

      sx:
        cx() +
        Math.cos(angle) *
        distance,


      sy:
        cy() +
        Math.sin(angle) *
        distance,


      tx:
        p.x,


      ty:
        p.y,


      angle:
        Math.random() *
        Math.PI *
        2,


      hue:
        Math.random() *
        360,


      delay:
        Math.random() *
        1.8

    });

  }

}


/* =====================================================
   PHÁO HOA
===================================================== */

let fireworks = [];


function createFirework() {

  fireworks = [];


  const amount =
    isMobile
      ? 160
      : 250;


  for (
    let i = 0;
    i < amount;
    i++
  ) {


    fireworks.push({

      x:
        cx(),


      y:
        cy(),


      angle:
        Math.random() *
        Math.PI *
        2,


      velocity:
        2 +
        Math.random() * 5,


      life:
        80 +
        Math.random() * 40,


      hue:
        Math.random() *
        360

    });

  }

}


/* =====================================================
   ANIMATION
===================================================== */

let startTime = null;

let heartFinished = false;

let backgroundShown = false;


function draw(timestamp) {


  if (!startTime) {

    startTime =
      timestamp;

  }


  const elapsed =
    (
      timestamp -
      startTime
    ) / 1000;


  /* ================================================
     BACKGROUND
  ================================================ */

  ctx.fillStyle =
    "rgba(0,0,0,0.15)";


  ctx.fillRect(
    0,
    0,
    width,
    height
  );


  /* ================================================
     PARTICLES
  ================================================ */

  let completed = 0;


  particles.forEach(
    p => {


      let progress =
        (
          elapsed -
          p.delay
        ) / 5;


      progress =
        Math.max(
          0,
          Math.min(
            1,
            progress
          )
        );


      if (
        progress >= 1
      ) {

        completed++;

      }


      const spiral =
        (1 - progress) *
        180;


      const angle =
        p.angle +
        progress * 12;


      const x =

        (1 - progress) *
        p.sx

        +

        progress *
        (
          cx() +
          p.tx
        )

        +

        Math.cos(angle) *
        spiral;


      const y =

        (1 - progress) *
        p.sy

        +

        progress *
        (
          cy() +
          p.ty
        )

        +

        Math.sin(angle) *
        spiral;


      ctx.beginPath();


      const color =

        `hsl(
          ${(p.hue + elapsed * 80) % 360}
          100%
          60%
        )`;


      ctx.fillStyle =
        color;


      ctx.shadowBlur =
        isMobile
          ? 7
          : 12;


      ctx.shadowColor =
        color;


      ctx.arc(

        x,
        y,

        isMobile
          ? 1.35
          : 1.6,

        0,
        Math.PI * 2

      );


      ctx.fill();


    }
  );


  /* ================================================
     TRÁI TIM HOÀN THÀNH
  ================================================ */

  if (
    completed >=
    particles.length * 0.995
    &&
    !heartFinished
  ) {


    heartFinished = true;


    /* ---------------------------------------------
       ẢNH NỀN XUẤT HIỆN
    --------------------------------------------- */

    setTimeout(
      () => {


        document
          .getElementById(
            "background"
          )
          .classList.add(
            "show"
          );


        /*
          Giảm canvas xuống
          nhưng vẫn giữ hạt
        */

        canvas.style.opacity =
          "0.45";


      },
      500
    );


    /* ---------------------------------------------
       HIỆN CHỮ
    --------------------------------------------- */

    setTimeout(
      () => {


        document
          .getElementById(
            "msg"
          )
          .style.opacity =
          "1";


      },
      1200
    );


    /* ---------------------------------------------
       PHÁO HOA
    --------------------------------------------- */

    setTimeout(
      () => {


        if (
          fireworks.length === 0
        ) {

          createFirework();

        }


      },
      1500
    );

  }


  /* ================================================
     FIREWORKS
  ================================================ */

  fireworks.forEach(
    f => {


      f.x +=
        Math.cos(
          f.angle
        ) *
        f.velocity;


      f.y +=
        Math.sin(
          f.angle
        ) *
        f.velocity;


      f.velocity *=
        0.985;


      f.life--;


      const alpha =
        Math.max(
          f.life,
          0
        ) / 120;


      ctx.beginPath();


      ctx.fillStyle =

        `hsla(
          ${f.hue},
          100%,
          60%,
          ${alpha}
        )`;


      ctx.shadowBlur =
        isMobile
          ? 5
          : 8;


      ctx.shadowColor =
        ctx.fillStyle;


      ctx.arc(

        f.x,
        f.y,

        isMobile
          ? 1.6
          : 2,

        0,
        Math.PI * 2

      );


      ctx.fill();


    }
  );


  fireworks =
    fireworks.filter(
      f =>
        f.life > 0
    );


  requestAnimationFrame(
    draw
  );

}


/* =====================================================
   KHỞI ĐỘNG
===================================================== */

resize();

createParticles();

requestAnimationFrame(
  draw
);

</script>

</body>

</html>
